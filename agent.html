<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MADA Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page">
      <div class="background" aria-hidden="true">
        <div class="background__pattern"></div>
      </div>

      <main class="content">
        <header class="content__hero">
          <h1 class="heading">How can I help you today Musaab?</h1>
        </header>

        <div class="voice-wave" aria-hidden="true">
          <canvas id="voice-glow-canvas"></canvas>
        </div>

        <div class="chat-session">
          <div
            id="messages"
            class="messages"
            role="log"
            aria-live="polite"
            aria-relevant="additions"
          ></div>

          <div class="chat-area">
            <div class="chat-glow" aria-hidden="true"></div>

            <div class="scope">
              <div class="scope__bar" id="scope-bar"></div>
            </div>

            <form id="chat-input" class="chat-box">
            <div class="chat-box__input-wrap">
              <textarea
                id="chatinput"
                class="chat-box__input"
                rows="1"
                placeholder=" "
                aria-label="Chat input"
              ></textarea>
              <span
                id="chat-placeholder"
                class="chat-box__placeholder"
                aria-hidden="true"
              >
                <span>Ask MADA </span><span id="typed-phrase"></span
                ><span
                  class="chat-box__placeholder-cursor"
                  aria-hidden="true"
                ></span>
              </span>
            </div>

            <div class="chat-box__toolbar">
              <button
                type="button"
                id="mic-btn"
                class="icon-btn"
                aria-label="Start voice recording"
                aria-pressed="false"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M11.25 21v-2.286a8.25 8.25 0 0 1-7.5-8.214.75.75 0 0 1 1.5 0 6.75 6.75 0 0 0 13.5 0 .75.75 0 0 1 1.5 0 8.25 8.25 0 0 1-7.5 8.214V21a.75.75 0 0 1-1.5 0m4-14a3.25 3.25 0 0 0-6.5 0v3a3.25 3.25 0 0 0 6.5 0zm1.5 3a4.75 4.75 0 1 1-9.5 0V7a4.75 4.75 0 0 1 9.5 0z"
                  />
                </svg>
              </button>

              <button
                type="submit"
                id="chatinput-send-message-button"
                class="send-btn"
                disabled
                aria-label="Send message"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M11 19V7.415l-3.293 3.293a1 1 0 1 1-1.414-1.414l5-5 .074-.067a1 1 0 0 1 1.34.067l5 5a1 1 0 1 1-1.414 1.414L13 7.415V19a1 1 0 1 1-2 0"
                  />
                </svg>
                <span class="sr-only">Send message</span>
              </button>
            </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <nav class="history-rail" aria-label="Chat navigation">
      <div class="history-rail__top">
        <button
          type="button"
          id="history-toggle"
          class="history-rail__btn"
          aria-label="Open chat history"
          aria-expanded="false"
          aria-controls="history-panel"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.75"
            aria-hidden="true"
          >
            <rect x="4" y="5" width="16" height="14" rx="2" />
            <path stroke-linecap="round" d="M9 5v14" />
          </svg>
        </button>

        <button
          type="button"
          id="new-chat-btn"
          class="history-rail__btn"
          aria-label="New chat"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.75"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 5v14M5 12h14"
            />
          </svg>
        </button>
      </div>
    </nav>

    <div
      id="history-backdrop"
      class="history-backdrop"
      aria-hidden="true"
    ></div>

    <aside
      id="history-panel"
      class="history-panel"
      aria-label="Chat history"
      aria-hidden="true"
    >
      <div class="history-panel__header">
        <span class="history-panel__brand">MADA</span>
        <h2 class="history-panel__title">Recents</h2>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </aside>

    <script src="index.js" defer></script>
  </body>
</html>
